<header class="cab">
  <div class="cab__fila">
    <div class="cab__marca">
      <img src="logo.svg" alt="" />
      <span>
        <strong>Sakura Hanami</strong>
        <small>Mesa {{ mesaId() }}</small>
      </span>
    </div>

    @if (cuentaId()) {
      @if (llamadaPendiente()) {
        <span class="cab__llamada">🔔 Camarero avisado</span>
      } @else {
        <button type="button" class="sh-btn sh-btn--primario cab__llamar" [disabled]="enviando()" (click)="llamarCamarero()">
          🔔 Llamar camarero
        </button>
      }
    }
  </div>

  <nav class="cab__nav">
    <a [routerLink]="['/menu', mesaId()]" routerLinkActive="activo">Carta</a>
    <a [routerLink]="['/cuenta', mesaId()]" routerLinkActive="activo">Mis platos y cuenta</a>
  </nav>

  @if (mensaje()) {
    <div class="cab__toast" role="status">{{ mensaje() }}</div>
  }
</header>
