<main class="login-container">
  <section class="login-card">
    <img src="logo.svg" alt="" class="logo" />
    <p class="sh-eyebrow">Bienvenido a Sakura Hanami</p>
    <h1>Mesa {{ tableId() }}</h1>

    <p class="instructions">Introduce el código de tu mesa (te lo da el camarero) para ver la carta, pedir y seguir tus platos.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="campo" for="password">
        Código de la mesa
        <input id="password" type="password" inputmode="numeric" formControlName="password" placeholder="••••" autocomplete="one-time-code">
      </label>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="sh-btn sh-btn--primario" [disabled]="loginForm.invalid || isLoading()">
        {{ isLoading() ? 'Comprobando…' : 'Ver la carta' }}
      </button>
    </form>
  </section>
</main>
