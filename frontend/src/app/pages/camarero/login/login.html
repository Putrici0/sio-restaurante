<main class="login">
  <section class="login__card">
    <img src="logo.svg" alt="" class="login__logo" />
    <p class="login__eyebrow">Personal de sala</p>
    <h1 class="login__titulo">Sakura Hanami</h1>

    <form class="login__form" (ngSubmit)="iniciarSesion()" novalidate>
      <label class="campo">
        <span>Usuario</span>
        <input type="text" name="usuario" autocomplete="username" [(ngModel)]="usuario" placeholder="camarero1" />
      </label>

      <label class="campo">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" [(ngModel)]="password" />
      </label>

      @if (error()) {
        <p class="login__error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="sh-btn sh-btn--primario login__entrar" [disabled]="cargando()">
        {{ cargando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="login__pie">Demo: <strong>camarero1</strong> / <strong>sakura</strong> · <a routerLink="/">Volver a la web</a></p>
  </section>
</main>
