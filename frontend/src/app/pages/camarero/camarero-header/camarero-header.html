<header class="cab">
  <a class="cab__marca" routerLink="/camarero/mesas">
    <img src="logo.svg" alt="" />
    <span>
      <strong>Sakura Hanami</strong>
      <small>{{ nombre }}</small>
    </span>
  </a>

  <div class="cab__acciones">
    <button type="button" class="cab__campana" [class.cab__campana--nuevo]="avisoNuevo()"
            (click)="togglePanel()" [attr.aria-label]="avisos().length + ' llamadas de clientes'">
      🔔
      @if (avisos().length > 0) {
        <span class="cab__badge">{{ avisos().length }}</span>
      }
    </button>
    <button type="button" class="cab__salir" (click)="salir()" aria-label="Cerrar sesión">⎋</button>
  </div>

  @if (panelAbierto()) {
    <section class="avisos" aria-label="Llamadas de clientes">
      <h2>Clientes que llaman</h2>
      @for (n of avisos(); track n.id) {
        <article class="aviso">
          <div>
            <strong>{{ mesasTexto(n) }}</strong>
            <span>{{ haceCuanto(n) }}</span>
          </div>
          <button type="button" class="sh-btn sh-btn--primario" [disabled]="atendiendoId() === n.id" (click)="atender(n)">
            Atendido
          </button>
        </article>
      } @empty {
        <p class="avisos__vacio">Ningún cliente está llamando ahora mismo.</p>
      }
    </section>
  }
</header>

<nav class="tabs" aria-label="Secciones de sala">
  <a routerLink="/camarero/mesas" routerLinkActive="activo"><span aria-hidden="true">🪑</span>Mesas</a>
  <a routerLink="/camarero/platos" routerLinkActive="activo"><span aria-hidden="true">🍣</span>Platos</a>
  <a routerLink="/camarero/bebidas" routerLinkActive="activo"><span aria-hidden="true">🍵</span>Bebidas</a>
  <a routerLink="/camarero/reservas" routerLinkActive="activo"><span aria-hidden="true">📅</span>Reservas</a>
</nav>
